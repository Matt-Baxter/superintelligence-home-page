syntax = "proto3";

package si.v1;

import "google/protobuf/struct.proto";

// Namespaces of qualified ids (lib/ids.js)
enum Namespace {
  NAMESPACE_UNSPECIFIED = 0;
  NAMESPACE_TOPIC = 1;
  NAMESPACE_ORG = 2;
  NAMESPACE_BENCHMARK = 3;
  NAMESPACE_PERSON = 4;
  NAMESPACE_CONCEPT = 5;
  NAMESPACE_REQ = 6;
  NAMESPACE_MODULE = 7;
  NAMESPACE_SOURCE = 8;
  NAMESPACE_STORY = 9;
}

// How a tag was made
enum TagMethod {
  TAG_METHOD_UNSPECIFIED = 0;
  TAG_METHOD_ONTOLOGY_TERM = 1;
  TAG_METHOD_ENTITY = 2;
  TAG_METHOD_CONCEPT_TERM = 3;
  TAG_METHOD_EMBEDDING = 4;
  TAG_METHOD_RULE = 5;
  TAG_METHOD_HUMAN = 6;
}

// Which part of the REQ-003 rule decided
enum ScopeRule {
  SCOPE_RULE_UNSPECIFIED = 0;
  SCOPE_RULE_STRONG = 1;
  SCOPE_RULE_TOPICS = 2;
  SCOPE_RULE_NONE = 3;
}

// A label on a story or chunk that explains itself: what it is (qid), the words that matched, and how it was made.
message Tag {
  string qid = 1; // Qualified id, e.g. topic:alignment
  string label = 2; // Readable label
  repeated string matched = 3; // Words in the text that produced the tag
  optional string via = 4; // Child topic that implied this parent topic
  TagMethod method = 5; // How the tag was made
  optional double score = 6; // Confidence 0-1 when the method gives one (embedding similarity)
}

// REQ-003 verdict from lib/rules/scope.json.
message ScopeDecision {
  bool in = 1; // Shown in the superintelligence feed
  ScopeRule rule = 2; // Which branch decided
  string reason = 3; // Plain-language reason
  optional string term = 4; // The strong term that matched
  repeated string topics = 5; // Top-level topic ids that matched
}

// One story, grouped across sources.
message Story {
  int64 id = 1; // Row id; qualified as story:<id>
  string title = 2;
  string url = 3;
  optional string summary = 4;
  optional string published_at = 5;
  repeated Tag tags = 6; // Topics, organisations, benchmarks, people, concepts
  ScopeDecision scope = 7; // Why it is (or isn't) in the feed
  optional int64 significance = 8; // 0-100, explained in lib/analysis.js
}

// A passage of a story's text, the unit that gets tagged and embedded.
message Chunk {
  int64 story_id = 1;
  int64 ord = 2; // Position in the story, from 0
  string text = 3;
  string hash = 4; // sha1 of the text, so unchanged chunks aren't redone
  repeated Tag tags = 5;
}

// A vector for a chunk or concept. The default model is a free local hashing embedding; others can be plugged in as adapters.
message Embedding {
  string subject = 1; // What is embedded: chunk:<story>:<ord> or concept:<id>
  string model = 2; // Adapter id, e.g. hash-256
  int64 dims = 3;
  repeated double vector = 4;
}

// A link in the knowledge graph between two qualified ids, with the evidence for it.
message Edge {
  string src = 1; // Qualified id
  string rel = 2; // Relation, e.g. co-occurs, needs, part-of
  string dst = 3; // Qualified id
  double weight = 4; // Strength (co-occurring chunks, or 1 for curated links)
  repeated string evidence = 5; // Chunk or story ids that support it
}

// Input to the tagging service.
message TagRequest {
  string title = 1;
  optional string summary = 2;
  repeated string taggers = 3; // Adapter ids to run; empty means all
}

// Output of the tagging service.
message TagResult {
  repeated Tag tags = 1;
  ScopeDecision scope = 2;
}

// Evaluate an si-expr rule (lib/expr) on data.
message EvalRequest {
  google.protobuf.Value rule = 1; // An si-expr AST, or the name of a rule in lib/rules
  google.protobuf.Value data = 2;
}

// Result of an si-expr evaluation.
message EvalResult {
  google.protobuf.Value value = 1;
}

// Served as JSON-RPC 2.0 at POST /api/knowledge/rpc (methods knowledge.tag, knowledge.evaluate) and described as a gRPC service in schema/gen/si.proto.
service Knowledge {
  rpc Tag(TagRequest) returns (TagResult); // Tag text with the registered taggers and decide scope
  rpc Evaluate(EvalRequest) returns (EvalResult); // Evaluate an si-expr rule
}
