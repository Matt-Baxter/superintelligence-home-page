<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Response builder · Superintelligence Homepage</title><link rel="stylesheet" href="/css/app.css">
<style>
.bd-grid{display:grid;grid-template-columns:minmax(0,16rem) minmax(0,1fr);gap:1rem}@media (max-width:760px){.bd-grid{grid-template-columns:minmax(0,1fr)}}
.bd-list{list-style:none;margin:0;padding:0}.bd-list li{padding:.45rem 0;border-top:1px solid var(--line,#ddd)}.bd-list a[aria-current]{font-weight:600}
.bd-beat{border-top:1px solid var(--line,#ddd);padding:.6rem 0}.bd-line{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:.5rem;align-items:start;margin:.3rem 0}
.bd-line textarea{width:100%;min-height:2.4rem;font:inherit}.bd-tag{font-size:.78rem;border:1px solid currentColor;border-radius:.3rem;padding:0 .35rem;white-space:nowrap}
#bdOne,#bdList{overflow-wrap:anywhere;min-width:0}#bdList{align-self:start;align-content:start}.bd-table{width:100%;border-collapse:collapse;font-size:.92rem}.bd-table td,.bd-table th{border-top:1px solid var(--line,#ddd);padding:.3rem;text-align:left;vertical-align:top}
</style></head>
<body><main>
<div class="pagehead"><div><h1>Response builder</h1><p class="muted">Edit a paper response in place. Every change is a named action: checked, audited and saved as a new version, with the knowledge graph kept in step. Rendering runs on the worker, not here.</p></div></div>
<p id="bdStatus" class="small muted" role="status">Loading…</p>
<div class="bd-grid">
<section class="panel" id="bdList" aria-label="Responses"></section>
<section id="bdOne" aria-live="polite"></section>
</div>
</main><script src="/js/api.js"></script><script>
// Everything here goes through the data layer: GET/POST /api/data/sources/:id and POST /api/data/actions/:id.
const source = (id, params = {}) => api(`/api/data/sources/${encodeURIComponent(id)}`, { body: { params } }).then((r) => r.data);
const action = (id, input) => api(`/api/data/actions/${encodeURIComponent(id)}`, { body: { input } });
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const status = (t, err) => { $("#bdStatus").className = err ? "err" : "small muted"; $("#bdStatus").textContent = t; };
let slug = params.get("r");
async function list() {
  const rows = await source("responses.list");
  const box = $("#bdList"); box.replaceChildren(el("h2", "Responses"));
  if (!rows.length) { box.append(el("p", "No responses yet. Build one on the Paper responses page.")); return rows; }
  const ul = el("ul", undefined, "bd-list");
  for (const r of rows) { const li = el("li"), a = el("a", r.title); a.href = `?r=${encodeURIComponent(r.slug)}`; if (r.slug === slug) a.setAttribute("aria-current", "page"); a.onclick = (e) => { e.preventDefault(); open(r.slug); }; li.append(a, el("div", `v${r.version} · rigor ${r.rigor ?? "–"} · ${r.beats} beats${r.rendered ? " · rendered" : ""}`, "small muted")); ul.append(li); }
  box.append(ul); return rows;
}
async function open(s, quiet = false) {
  slug = s; history.replaceState(null, "", `?r=${encodeURIComponent(s)}`);
  const [p, links] = await Promise.all([source("responses.get", { slug: s }), source("responses.connections", { slug: s }).catch(() => [])]);
  setPageContext(p.title.length > 32 ? `${p.title.slice(0, 30).trim()}…` : p.title);
  const box = $("#bdOne"); box.replaceChildren();
  const sec = (h) => { const x = el("section", undefined, "panel"); x.append(el("h2", h)); box.append(x); return x; };
  const head = sec(p.title); head.append(el("p", p.plan.thesis), el("p", `Version ${p.version} of ${p.current}. Situation ${p.plan.search.situation}; beats chosen by A*: ${p.plan.search.chosen.join(" → ")}.`, "small muted"));
  const acts = el("div", undefined, "actions");
  const btn = (label, fn, primary) => { const b = el("button", label, primary ? "btn primary" : "btn"); b.type = "button"; b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { status(e.message, true); if (/was saved/.test(e.message)) await refresh().catch(() => {}); } finally { b.disabled = false; } }; acts.append(b); return b; };
  const secs = el("input"); secs.type = "number"; secs.min = 40; secs.max = 180; secs.value = 90; secs.setAttribute("aria-label", "Length limit in seconds"); secs.style.width = "5rem";
  acts.append(secs);
  btn("Re-plan", async () => { const r = await action("responses.replan", { slug: s, maxSeconds: Number(secs.value), expectVersion: p.current }); status(`Version ${r.result.version}: ${r.result.chosen.join(" → ")}.${r.result.edits ? ` Your edits: ${r.result.edits.kept} kept${r.result.edits.dropped.length ? `, ${r.result.edits.dropped.length} dropped (their beat is no longer in the plan): ${r.result.edits.dropped.join("; ")}` : ""}.` : ""}`); await refresh(); });
  btn("Queue a render", async () => { const r = await action("responses.queue-render", { slug: s, learn: true }); status(`Queued learn job ${r.result.job} for version ${r.result.version}. Run the Learn worker on a machine with Manim.`); });
  btn("Save article as draft", async () => { const r = await action("responses.save-draft", { slug: s }); status(`Draft ${r.result.id} saved from version ${r.result.fromVersion}.`); await refresh(); });
  head.append(acts);
  const checks = el("ul"); for (const c of p.checks || []) checks.append(el("li", `${c.ok ? "✓" : "✗"} ${c.id}: ${c.why}`)); head.append(checks);
  if (p.offer && p.offer.offering) head.append(el("p", `Suggested offering: ${p.offer.offering}, ${p.offer.voice === "none" ? "no video" : `${p.offer.voice} voice`}, on ${p.offer.channel} (a simulation's suggestion).`, "small muted"));
  // Beats: every line editable; saving a line is the responses.edit-line action.
  const plan = sec("Beats and lines");
  p.plan.beats.forEach((b, bi) => {
    const d = el("div", undefined, "bd-beat"); d.append(el("strong", `${bi + 1}. ${b.id} · ${b.variant} · ${b.visual.kind}`), el("div", b.goal || "", "small muted"));
    b.lines.forEach((l, li) => {
      const row = el("div", undefined, "bd-line"), ta = el("textarea"); ta.value = l.text; ta.setAttribute("aria-label", `Beat ${bi + 1}, line ${li + 1}`);
      const save = el("button", "Save", "btn"); save.type = "button";
      save.onclick = async () => { if (ta.value.trim() === l.text) return; save.disabled = true; try { const r = await action("responses.edit-line", { slug: s, beat: bi, line: li, text: ta.value, expectVersion: p.current }); status(`Saved as version ${r.result.version}. ${r.result.checks.filter((c) => !c.ok).map((c) => c.why).join("; ") || "All plan checks pass."}`); await refresh(); } catch (e) { status(e.message, true); if (/was saved/.test(e.message)) await refresh().catch(() => {}); } finally { save.disabled = false; } };
      row.append(el("span", l.cue === null ? "voice" : `cue ${l.cue}`, "bd-tag"), ta, save); d.append(row);
    });
    plan.append(d);
  });
  if (p.qa && p.qa.length) { const q = sec("Last render's quality checks"); const ul = el("ul"); p.qa.forEach((x) => ul.append(el("li", `${x.skip ? "–" : x.ok ? "✓" : "✗"} ${x.id}: ${x.why}`))); q.append(ul); }
  // Versions: restore is the data.restore action (a new version, nothing deleted).
  const ver = sec("Versions"); const t = el("table", undefined, "bd-table"); t.innerHTML = "<thead><tr><th>Version</th><th>Note</th><th>Files</th><th></th></tr></thead>"; const tb = el("tbody");
  for (const h of p.history || []) { const tr = el("tr"); tr.append(el("td", `v${h.version}`), el("td", `${h.note || ""} · ${h.at}`), el("td", (h.files || []).map((f) => f.path).join(", ") || "–")); const td = el("td"); if (h.version !== p.current) { const b = el("button", "Restore", "btn"); b.type = "button"; b.onclick = async () => { try { const r = await action("data.restore", { kind: "response", key: s, version: h.version, expectVersion: p.current }); status(`Restored as version ${r.result.version}.`); await refresh(); } catch (e) { status(e.message, true); } }; td.append(b); } tr.append(td); tb.append(tr); }
  t.append(tb); ver.append(t);
  const con = sec("Connections in the knowledge graph"); if (!links.length) con.append(el("p", "No connections yet.", "small muted"));
  else { const ul = el("ul"); for (const k of links.filter((x) => !/\/(claim|check|question|beat|qa)\//.test(x.other)).slice(0, 40)) ul.append(el("li", `${k.rel} → ${k.other}`)); ul.append(el("li", `${(p.analysis && p.analysis.contributions || []).length} claims, ${p.plan.beats.length} beats, ${(p.analysis && p.analysis.checklist || []).length} checks in its graph`, "small muted")); con.append(ul); }
  // Presence (REQ-069, proposed): a soft claim says this response is open here; others who have it open are named,
  // so two people (or a person and an agent) know before they edit. Saves still refuse a stale version.
  let others = [];
  try { const r = await action("work.claim", { task: `response:${s}`, soft: true }); others = (r.result.warnings || []).filter((w) => w.type === "presence").map((w) => w.actor); } catch {}
  if (others.length) head.insertBefore(el("p", `Also open by ${others.join(", ")}. If they save first, your save is refused and you reload; nothing is overwritten.`, "small"), acts);
  if (!quiet) status(`Opened version ${p.version}.`);
}
async function refresh() { await list(); if (slug) await open(slug, true); } // keeps the action's message
api("/api/me", { allow401: true }).then(async ({ user }) => {
  topbar(user);
  if (!user || !user.admin) { $("#bdOne").replaceChildren(el("p", "The builder is for admins.")); status(""); return; }
  try { const rows = await list(); if (!slug && rows[0]) slug = rows[0].slug; if (slug) await open(slug); else status(""); }
  catch (e) { status(/found|404/i.test(e.message) ? "Paper responses are switched off." : e.message, true); }
});
</script></body></html>
