<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Journal · Superintelligence Homepage</title><link rel="stylesheet" href="/css/app.css"></head><body><main><div class="pagehead"><div><h1>Journal</h1><p class="muted">Original editorial posts. Commentary is separate from imported research and its significance scores.</p></div><a href="/">Research feed</a></div><section id="journal" class="panel editorial-prose" aria-live="polite"><p>Loading published posts…</p></section></main><script src="/js/api.js"></script><script>
async function loadJournal(){const slug=params.get('slug');if(slug){const {post}=await api(`/api/editorial/posts/${encodeURIComponent(slug)}`);document.title=post.title+' · Journal';setPageContext(post.title);const article=document.createElement('article'),heading=document.createElement('h2');heading.textContent=post.title;article.append(heading);const summary=document.createElement('p');summary.className='muted';summary.textContent=post.summary;article.append(summary);const date=document.createElement('p');date.className='small muted';date.textContent='Published '+post.published_at;article.append(date);for(const text of post.body.split(/\n\s*\n/)){const p=document.createElement('p');p.textContent=text;article.append(p);}const back=document.createElement('a');back.href='/m/journal';back.textContent='All published posts';$('#journal').replaceChildren(back,article);}else{const {posts}=await api('/api/editorial/posts');$('#journal').innerHTML=posts.length?posts.map(p=>`<article><h2><a href="/m/journal?slug=${encodeURIComponent(p.slug)}">${esc(p.title)}</a></h2><p>${esc(p.summary)}</p><p class="small muted">Published ${esc(p.published_at)}</p></article>`).join(''):'<p>No editorial posts have been published yet. <a href="/">Read the research feed</a>.</p>';}}
// ?embed=1 (REQ-054, proposed): a bare card for another site's iframe: no navigation, links open in the top window.
async function loadEmbed(){const slug=params.get('slug');document.body.classList.add('embed');document.querySelector('.pagehead')?.remove();const {post}=await api(`/api/editorial/posts/${encodeURIComponent(slug||'')}`);const a=document.createElement('article'),h=document.createElement('h2'),l=document.createElement('a');l.href=`/m/journal?slug=${encodeURIComponent(post.slug)}`;l.target='_top';l.textContent=post.title;h.append(l);const sm=document.createElement('p');sm.textContent=post.summary;const meta=document.createElement('p');meta.className='small muted';meta.textContent=`Journal · Superintelligence Homepage · ${String(post.published_at||'').slice(0,10)}`;a.append(h,sm,meta);$('#journal').replaceChildren(a);}
(params.get('embed')?loadEmbed():api('/api/me',{allow401:true}).then(({user})=>{topbar(user);return loadJournal();})).catch(e=>{showErr($('#journal'),e);});
</script></body></html>
